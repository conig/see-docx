[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "see-docx"
version = "0.1.0"
description = "A local, read-only DOCX previewer with live refresh"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
see-docx = "see_docx.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
